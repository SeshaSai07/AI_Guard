{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-lg mt-5 animate__animated animate__fadeIn">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-primary mb-3 animate__animated animate__bounce"></i>
                    <h3 class="card-title">Create Account</h3>
                    <p class="text-muted">Join AI Guard to protect yourself from job scams</p>
                </div>
                <form method="POST" action="{{ url_for('signup') }}">
                    <div class="mb-4 input-group">
                        <span class="input-group-text bg-light">
                            <i class="fas fa-user text-primary"></i>
                        </span>
                        <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-4 input-group">
                        <span class="input-group-text bg-light">
                            <i class="fas fa-lock text-primary"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create a password" required>
                    </div>
                    <div class="mb-4 input-group">
                        <span class="input-group-text bg-light">
                            <i class="fas fa-check-circle text-primary"></i>
                        </span>
                        <input type="password" class="form-control border-start-0" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg hover-shadow animate__animated animate__pulse">
                            <i class="fas fa-user-shield me-2"></i>Create Account
                        </button>
                    </div>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted">Already have an account? 
                        <a href="{{ url_for('login') }}" class="text-primary text-decoration-none hover-shadow">
                            <i class="fas fa-sign-in-alt me-1"></i>Login
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
